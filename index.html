<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol-Pong 🌅🌙 | Tavel-Klocka</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        body {
            background: linear-gradient(180deg, #2b383d 0%, #151e22 100%);
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Själva Tavel-ramen som hänger på väggen */
        .art-frame {
            position: relative;
            background: #111a1d;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            display: block;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            image-rendering: pixelated;
        }

        /* Test- och inställningspanel för datorn (visas ej på tavlan) */
        .dev-controls {
            margin-top: 24px;
            background: rgba(17, 26, 29, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 20px;
            width: 100%;
            max-width: 492px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dev-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7b9299;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        label {
            font-size: 0.78rem;
            font-weight: 600;
            color: #8b9ea3;
            display: flex;
            justify-content: space-between;
        }

        label span {
            color: #e5ece9;
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #e5ece9;
            cursor: pointer;
        }

        select, button {
            background: #1c272b;
            color: #c9d1d9;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }

        select:hover, button:hover {
            background: #28373d;
            border-color: #a0b2b8;
        }

        button.active {
            background: #238636;
            border-color: #2ea043;
            color: #fff;
        }

        .speed-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .gear-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8b9ea3;
            font-size: 13px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.25;
            transition: all 0.2s ease;
            margin-top: 14px;
            padding: 0;
        }

        .gear-btn:hover {
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: rotate(45deg);
        }

        .dev-controls.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 🖼️ TAVLAN SOM HÄNGER PÅ VÄGGEN -->
    <div class="art-frame">
        <canvas id="pongCanvas" width="460" height="492"></canvas>
    </div>

    <!-- ⚙️ SUBTIL MINIMALISTISK KNAPP FÖR ATT FÄLLA UT INSTÄLLNINGAR -->
    <button id="toggleSettingsBtn" class="gear-btn" title="Inställningar" aria-label="Inställningar">⚙️</button>

    <!-- 🛠️ INSTÄLLNINGSPANEL (Dold som standard) -->
    <div id="devControls" class="dev-controls hidden">
        <div class="dev-header">
            <span>⚙️ Inställningar</span>
            <button id="resetBtn" style="padding: 3px 8px; font-size: 0.72rem;">🔄 Nollställ</button>
        </div>

        <div class="control-row">
            <div class="control-group">
                <label>Plats: <button id="geoBtn" style="padding: 2px 6px; font-size: 0.68rem; margin-left: 8px;">📍 Hämta min plats</button></label>
                <select id="locationSelect">
                    <option value="stockholm">Stockholm (59.33° N)</option>
                    <option value="goteborg">Göteborg (57.70° N)</option>
                    <option value="malmo">Malmö (55.60° N)</option>
                    <option value="visby">Visby (57.63° N)</option>
                    <option value="karlstad">Karlstad (59.38° N)</option>
                    <option value="sundsvall">Sundsvall (62.39° N)</option>
                    <option value="umea">Umeå (63.83° N)</option>
                    <option value="kiruna">Kiruna (67.86° N)</option>
                    <option value="custom">🎯 Egen koordinat...</option>
                </select>
            </div>
            <div class="control-group">
                <label>Färgtema:</label>
                <select id="themeSelect">
                    <option value="nordic">Nordic Slate (Skiffer & Is)</option>
                    <option value="eink">E-Ink Minimal (Svart & Vit)</option>
                    <option value="paper_charcoal">Wabi-Sabi (Papper & Kol)</option>
                    <option value="aurora">Aurora (Polarsken & Natt)</option>
                    <option value="falu">Falu Rödfärg (Linolja & Slam)</option>
                    <option value="terracotta">Terracotta & Sand</option>
                    <option value="amber">Vintage Amber (Bärnsten)</option>
                    <option value="arcade">70s Arcade (Fosforgrön)</option>
                    <option value="cyberpunk">Synthwave (Isblå & Magenta)</option>
                </select>
            </div>
        </div>

        <div id="customCoordsRow" class="control-row" style="display: none;">
            <div class="control-group">
                <label>Latitud (°N):</label>
                <input type="number" id="customLatInput" step="0.01" value="59.33" style="background: #1c272b; color: #c9d1d9; border: 1px solid rgba(255,255,255,0.1); padding: 5px 8px; border-radius: 6px; font-size: 0.8rem;">
            </div>
            <div class="control-group">
                <label>Longitud (°E):</label>
                <input type="number" id="customLonInput" step="0.01" value="18.07" style="background: #1c272b; color: #c9d1d9; border: 1px solid rgba(255,255,255,0.1); padding: 5px 8px; border-radius: 6px; font-size: 0.8rem;">
            </div>
        </div>

        <div class="control-group">
            <label>Hastighet / Skärmläge:</label>
            <div class="speed-buttons">
                <button id="btnSlow" class="active">🔴 1x Dygnsrytm (24h)</button>
                <button id="btnZen">🍃 E-Ink Zen (10s)</button>
                <button id="btnEinkFast">⚡️ E-Ink Max (3 fps)</button>
            </div>
        </div>

        <div class="control-group">
            <label>Årstid / Dag på året: <span id="dateDisplay">31 Augusti</span></label>
            <input type="range" id="dayOfYearSlider" min="1" max="365" value="243">
        </div>
    </div>

    <script src="solpong.js"></script>
</body>
</html>
