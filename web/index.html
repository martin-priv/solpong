<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>solpong</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        body {
            background: linear-gradient(180deg, #2b383d 0%, #151e22 100%);
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Själva Tavel-ramen som hänger på väggen */
        .art-frame {
            position: relative;
            background: #111a1d;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            display: block;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            image-rendering: pixelated;
        }

        /* Subtil, avskalad inställningspanel (Wabi-Sabi / Nordic Slate minimalism) */
        .dev-controls {
            margin-top: 20px;
            background: rgba(14, 21, 24, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 18px 22px;
            width: 100%;
            max-width: 492px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.03);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .dev-controls.hidden {
            display: none;
        }

        .dev-header {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6c8289;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .btn-text {
            background: none;
            border: none;
            color: #7d949b;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 0.5px;
            cursor: pointer;
            padding: 0;
            transition: color 0.15s ease;
        }

        .btn-text:hover {
            color: #e5ece9;
            background: none;
            border: none;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        label {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #6c8289;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label span {
            color: #d6e0dd;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
        }

        .micro-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8da2a8;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 9px;
            letter-spacing: 0.5px;
            padding: 2px 7px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .micro-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.18);
        }

        /* Minimalistiska Dropdowns */
        select {
            background: rgba(255, 255, 255, 0.035);
            color: #dbe3e0;
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            width: 100%;
        }

        select:hover, select:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.16);
            color: #ffffff;
        }

        /* Sober Segmented Control för Hastighet */
        .segmented-control {
            display: flex;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 3px;
            gap: 2px;
        }

        .segmented-control button {
            flex: 1;
            background: transparent;
            border: none;
            color: #7b9096;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 11px;
            font-weight: 500;
            padding: 7px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
            outline: none;
        }

        .segmented-control button:hover {
            color: #c9d6d3;
            background: rgba(255, 255, 255, 0.03);
        }

        .segmented-control button.active {
            background: rgba(255, 255, 255, 0.11);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        }

        /* Minimalistisk slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            outline: none;
            margin: 8px 0;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #dce6e2;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            transition: transform 0.15s ease, background 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #ffffff;
        }

        .gear-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #6a7f85;
            font-size: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.35;
            transition: all 0.2s ease;
            margin-top: 16px;
            padding: 0;
        }

        .gear-btn:hover {
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.18);
            color: #d6e0dd;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>

    <!-- 🖼️ TAVLAN SOM HÄNGER PÅ VÄGGEN -->
    <div class="art-frame">
        <canvas id="pongCanvas" width="460" height="492"></canvas>
    </div>

    <!-- ⚙️ SUBTIL MINIMALISTISK KNAPP FÖR ATT FÄLLA UT INSTÄLLNINGAR -->
    <button id="toggleSettingsBtn" class="gear-btn" title="Inställningar" aria-label="Inställningar">⚙️</button>

    <!-- 🛠️ INSTÄLLNINGSPANEL (Sober & Avskalad) -->
    <div id="devControls" class="dev-controls hidden">
        <div class="dev-header">
            <span>Inställningar</span>
            <button id="resetBtn" class="btn-text">Återställ</button>
        </div>

        <div class="control-row">
            <div class="control-group">
                <label>Plats <button id="geoBtn" class="micro-btn">📍 GPS</button></label>
                <select id="locationSelect">
                    <option value="stockholm">Stockholm (59.33° N)</option>
                    <option value="goteborg">Göteborg (57.70° N)</option>
                    <option value="malmo">Malmö (55.60° N)</option>
                    <option value="visby">Visby (57.63° N)</option>
                    <option value="karlstad">Karlstad (59.38° N)</option>
                    <option value="sundsvall">Sundsvall (62.39° N)</option>
                    <option value="umea">Umeå (63.83° N)</option>
                    <option value="kiruna">Kiruna (67.86° N)</option>
                    <option value="custom">Egen koordinat...</option>
                </select>
            </div>
            <div class="control-group">
                <label>Färgtema</label>
                <select id="themeSelect">
                    <option value="paper_charcoal" selected>Wabi-Sabi (Papper & Kol)</option>
                    <option value="nordic">Nordic Slate (Skiffer & Is)</option>
                    <option value="eink">E-Ink Minimal (Svart & Vit)</option>
                    <option value="aurora">Aurora (Polarsken & Natt)</option>
                    <option value="falu">Falu Rödfärg (Linolja & Slam)</option>
                    <option value="terracotta">Terracotta & Sand</option>
                    <option value="amber">Vintage Amber (Bärnsten)</option>
                    <option value="arcade">70s Arcade (Fosforgrön)</option>
                    <option value="cyberpunk">Synthwave (Isblå & Magenta)</option>
                </select>
            </div>
        </div>

        <div id="customCoordsRow" class="control-row" style="display: none;">
            <div class="control-group">
                <label>Latitud (°N)</label>
                <input type="number" id="customLatInput" step="0.01" value="59.33" style="background: rgba(255,255,255,0.035); color: #dbe3e0; border: 1px solid rgba(255,255,255,0.07); padding: 7px 10px; border-radius: 8px; font-size: 0.8rem; font-family: 'SF Mono', monospace;">
            </div>
            <div class="control-group">
                <label>Longitud (°E)</label>
                <input type="number" id="customLonInput" step="0.01" value="18.07" style="background: rgba(255,255,255,0.035); color: #dbe3e0; border: 1px solid rgba(255,255,255,0.07); padding: 7px 10px; border-radius: 8px; font-size: 0.8rem; font-family: 'SF Mono', monospace;">
            </div>
        </div>

        <div class="control-group">
            <label>Hastighet</label>
            <div class="segmented-control">
                <button id="btn24h" class="active" title="True 24h: 1-2 studs per dygn">24h</button>
                <button id="btnDeepZen" title="Deep-Zen: 1 studs var ~20-25 min">Deep-Zen</button>
                <button id="btnZen" title="Zen: 1 studs var ~10s">Zen</button>
                <button id="btnStress" title="Stress: Snabbdemo">Stress</button>
            </div>
        </div>

        <div class="control-group">
            <label>Årstid <span id="dateDisplay">31 Augusti</span></label>
            <input type="range" id="dayOfYearSlider" min="1" max="365" value="243">
        </div>
    </div>

    <script src="solpong.js"></script>
</body>
</html>
